// ── BUILD ROWS ────────────────────────────────────────────────────────
function buildGroupRows(group) {
  const {
    spec: s,
    feats: f,
    type
  } = group;
  const rows = [];
  const isLocalVal = v => v && ['By local', 'Painted by local', 'Painted local'].includes(v);
  const scope = (title, isLocal = false) => rows.push({
    type: 'scope',
    title,
    isLocal
  });
  let n = 1,
    ln = 1;
  const hdr = t => rows.push({
    type: 'hdr',
    title: t
  });
  const item = (desc, qty = 1) => rows.push({
    type: 'item',
    no: n++,
    desc,
    qty
  });
  const litem = (desc, qty = 1) => rows.push({
    type: 'item',
    no: ln++,
    desc,
    qty,
    isLocal: true
  });
  if (type === 'escalator') {
    scope('Factory Scope', false);
    hdr('Technical Specification');
    item(["SMEC", "Escalator K2S3", s.escType && `Type: ${s.escType}`, s.escModel && `Model: ${s.escModel}`, s.escQty && `Qty: ${s.escQty}`].filter(Boolean).join(' | '), Number(s.escQty) || 1);
    if (s.escRise) item(`Rise: ${s.escRise} mm`);
    if (s.escInclination) item(`Inclination: ${s.escInclination}°`);
    if (s.escSpeed) item(`Speed: ${s.escSpeed} m/s`);
    if (s.escHandrailHeight) item(`Handrail height: ${s.escHandrailHeight} mm`);
    if (s.escGlassPanel) item(`Glass panel: ${s.escGlassPanel} mm`);
    item(`No. of flat step: ${s.escFlatStep}`);
    if (s.escOperation) item(`Operation: ${s.escOperation}`);
    if (s.escEnvironment) item(`Environment: ${s.escEnvironment}`);
    if (s.escAuxBreak === 'Yes') item('Aux. Break');
    if (s.escIntermediate === 'Yes') item('Intermediate support');
    if (s.escSpecRemark) item(`Remark: ${s.escSpecRemark}`);
    if (s.escCladding === 'Factory') item('Cladding: Factory');
    hdr('Appearance and Design');
    if (s.escStepLighting === 'Yes') item('Step lighting');
    if (s.escCombLighting === 'Yes') item('Comb lighting');
    if (s.escSkirtLighting === 'Yes') item('Skirt lighting');
    item(`Safety brush: ${s.escSafetyBrush}`);
    if (s.escFloorName === 'Yes') item('Floor name');
    item(`Operation Indicator: ${s.escOpIndicator === 'remark' ? s.escOpIndicatorRemark : s.escOpIndicator}`);
    item(`Handrail inlet: ${s.escHandrailInlet}`);
    if (s.escUpgradeTruss && s.escUpgradeTruss !== 'No') item(`Upgrade truss: ${s.escUpgradeTruss}`);
    if (s.escExtendTK) item(`Extend TK: ${s.escExtendTK} mm`);
    if (s.escExtendTJ) item(`Extend TJ: ${s.escExtendTJ} mm`);
    if (s.escShortenTK) item(`Shorten TK: ${s.escShortenTK} mm`);
    if (s.escAppRemark) item(`Remark: ${s.escAppRemark}`);
    hdr('Standard Features');
    item('SMS — Missing Step Device');
    item('SSS — Skirt Guard Safety Device');
    item('CRS — Step Motion Safety Device');
    item('HSS — Handrail Speed Safety Device');
    item('SRS — Step Level Device');
    item('HGS — Handrail Guard Safety Device');
    if (f.escBA || f.escSmartEye) {
      hdr('Optional Features');
      if (f.escBA) item('BA — Interface Building Management');
      if (f.escSmartEye) item('SmartEye — Monitoring System');
    }
    const hasEscLocal = s.escCladding === 'Local' || s.escLocalItems && s.escLocalItems.some(x => x);
    if (hasEscLocal) {
      scope('Local Scope', true);
      if (s.escCladding === 'Local') litem('Cladding: Local');
      if (s.escLocalItems) s.escLocalItems.forEach(it => {
        if (it) litem(it);
      });
    }
    return rows;
  }
  const isFreight = ['LEHY-G', 'LEHY-L-G'].includes(s.product);
  if (isFreight) {
    scope('Factory Scope', false);
    hdr('Product & Performance');
    item(['SMEC', s.product, s.kg && `${s.kg} kg`, s.quantity && `Qty: ${s.quantity}`].filter(Boolean).join(' | '), Number(s.quantity) || 1);
    if (s.speed) item(`Speed: ${s.speed} m/s`);
    if (s.freightType) item(`Type: ${s.freightType}`);
    if (s.freightOpMode) item(`Operation mode: ${s.freightOpMode}`);
    if (s.freightGate) item(`Gate: ${s.freightGate}`);
    if (s.freightDoorType) item(`Door type: ${s.freightDoorType}`);
    if (s.freightDoorWidth) item(`Door width: ${s.freightDoorWidth === 'remark' ? s.freightDoorWidthRemark : s.freightDoorWidth} mm`);
    if (s.freightDoorHeight) item(`Door height: ${s.freightDoorHeight === 'remark' ? s.freightDoorHeightRemark : s.freightDoorHeight} mm`);
    hdr('Car Dimension and Design');
    if (s.carWidth || s.carDepth) item(`Car dimension: ${s.carWidth || '--'} x ${s.carDepth || '--'} mm`);
    if (s.ceilingHeight) item(`Ceiling height: ${s.ceilingHeight === 'remark' ? s.ceilingRemark : s.ceilingHeight} mm`);
    if (s.ceilingType) item(`Ceiling type: ${s.ceilingType}`);
    if (s.carWallFinish && !isLocalVal(s.carWallFinish)) item(`Car wall: ${s.carWallFinish === 'remark' ? s.carWallFinishRemark : s.carWallFinish}`);
    if (s.carDoorFinish && !isLocalVal(s.carDoorFinish)) item(`Car door: ${s.carDoorFinish === 'remark' ? s.carDoorFinishRemark : s.carDoorFinish}`);
    if (s.frontReturnPanel && !isLocalVal(s.frontReturnPanel)) item(`Front return: ${s.frontReturnPanel === 'remark' ? s.frontReturnPanelRemark : s.frontReturnPanel}`);
    if (s.transomPanel && !isLocalVal(s.transomPanel)) item(`Transom: ${s.transomPanel === 'remark' ? s.transomPanelRemark : s.transomPanel}`);
    if (s.kickPlate && s.kickPlate !== 'No' && !isLocalVal(s.kickPlate)) item(`Kick plate: ${s.kickPlate === 'remark' ? s.kickPlateRemark : s.kickPlate}`);
    hdr('Entrance Design');
    if (s.landingDoorFinish && !isLocalVal(s.landingDoorFinish)) item('Landing door: ' + (s.landingDoorFinish === 'remark' ? s.landingDoorFinishRemark : s.landingDoorFinish));
    if (s.doorJambFinishMain) item('Door jamb (main floor): ' + (s.doorJambFinishMain === 'remark' ? s.doorJambFinishMainRemark : s.doorJambFinishMain === 'Painted by factory' ? 'Painted by factory' + (s.doorJambColorMain ? ' (' + s.doorJambColorMain + ')' : '') : s.doorJambFinishMain));
    if (s.doorJambFinish && !isLocalVal(s.doorJambFinish)) item('Door jamb (typical floor): ' + (s.doorJambFinish === 'remark' ? s.doorJambFinishRemark : s.doorJambFinish === 'Painted by factory' ? 'Painted by factory' + (s.doorJambColor ? ' (' + s.doorJambColor + ')' : '') : s.doorJambFinish));
    if (s.jambType) item('Jamb type: ' + s.jambType);
    item('Hall button: ZPI-GD10');
    hdr('Car Operating Panel');
    item('Main COP: ZCB-CD11');
    item('Button type: A12');
    hdr('Standard Features');
